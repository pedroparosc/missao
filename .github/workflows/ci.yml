# Integração contínua: testes (com cobertura mínima de 80% no pacote api) em várias versões
# do Python e build + smoke test da imagem Docker.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: verificador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: verificador/requirements*.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Rodar testes
        run: python -m pytest --cov=api --cov=cliente_api --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: cobertura
          path: verificador/coverage.xml

  docker:
    name: Build e smoke test da imagem
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml
        run: docker compose config --quiet
      - name: Build
        run: docker build -t verificador-prestacao:ci ./verificador
      - name: Smoke test (API responde e cria uma análise)
        run: |
          docker run -d --name api -p 8000:8000 verificador-prestacao:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/v1/saude && break
            sleep 2
          done
          curl -fsS http://localhost:8000/api/v1/saude | grep '"status":"ok"'
          curl -fsS -X POST http://localhost:8000/api/v1/analises \
            -F "extratos_corrente=@verificador/exemplos/dados/extrato_conta_corrente.pdf" \
            -F "planilha_gastos=@verificador/exemplos/dados/planilha_gastos.xlsx" | grep '"total_smf":60000.0'
      - name: Logs do contêiner (em caso de falha)
        if: failure()
        run: docker logs api
